<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 16" width="1200" height="16" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7b5cff"/>
      <stop offset="75%" stop-color="#ff2bd6"/>
      <stop offset="100%" stop-color="#ff2bd6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .s { animation: move 3.5s ease-in-out infinite alternate; }
    @keyframes move { from { transform: translateX(80px); } to { transform: translateX(1120px); } }
  </style>
  <rect x="0" y="7" width="1200" height="2" fill="url(#line)"/>
  <circle class="s" cx="0" cy="8" r="8" fill="url(#spark)"/>
</svg>

