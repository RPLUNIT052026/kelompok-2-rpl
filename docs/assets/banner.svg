<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="HyperEvac System banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="55%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#120a26"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7b5cff"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .sans { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
    .ring { fill: none; stroke: #00f0ff; stroke-width: 2; transform-origin: 1010px 160px; animation: pulse 3.6s ease-out infinite; opacity: 0; }
    .r2 { animation-delay: 1.2s; }
    .r3 { animation-delay: 2.4s; }
    @keyframes pulse {
      0%   { transform: scale(0.15); opacity: 0.9; }
      100% { transform: scale(1.6);  opacity: 0; }
    }
    .scan { animation: scan 4.5s linear infinite; }
    @keyframes scan {
      0%   { transform: translateY(-20px); opacity: 0; }
      10%  { opacity: 0.55; }
      90%  { opacity: 0.55; }
      100% { transform: translateY(340px); opacity: 0; }
    }
    .blink { animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    .flick { animation: flick 5s linear infinite; }
    @keyframes flick {
      0%, 92%, 100% { opacity: 1; }
      93% { opacity: 0.6; }
      95% { opacity: 1; }
      97% { opacity: 0.7; }
    }
    .sweep { transform-origin: 1010px 160px; animation: sweep 4s linear infinite; }
    @keyframes sweep { to { transform: rotate(360deg); } }
    .dot { animation: dot 2s ease-in-out infinite; }
    @keyframes dot { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
  </style>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- radar -->
  <g filter="url(#glow)">
    <circle cx="1010" cy="160" r="110" fill="none" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="1010" cy="160" r="70" fill="none" stroke="#7b5cff" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="1010" cy="160" r="30" fill="none" stroke="#ff2bd6" stroke-opacity="0.45" stroke-width="1.5"/>
    <line x1="900" y1="160" x2="1120" y2="160" stroke="#00f0ff" stroke-opacity="0.2"/>
    <line x1="1010" y1="50" x2="1010" y2="270" stroke="#00f0ff" stroke-opacity="0.2"/>
    <circle class="ring" cx="1010" cy="160" r="110"/>
    <circle class="ring r2" cx="1010" cy="160" r="110"/>
    <circle class="ring r3" cx="1010" cy="160" r="110"/>
    <g class="sweep">
      <path d="M1010 160 L1010 50 A110 110 0 0 1 1088 82 Z" fill="#00f0ff" fill-opacity="0.18"/>
      <line x1="1010" y1="160" x2="1010" y2="50" stroke="#00f0ff" stroke-width="2"/>
    </g>
    <circle cx="1010" cy="160" r="6" fill="#ff2bd6"/>
    <circle class="dot" cx="1062" cy="118" r="4" fill="#ffd400"/>
    <circle class="dot" cx="962" cy="205" r="4" fill="#00ff9c" style="animation-delay:.7s"/>
    <circle class="dot" cx="1050" cy="215" r="3.5" fill="#ff5a5a" style="animation-delay:1.3s"/>
  </g>

  <!-- title -->
  <g class="flick" filter="url(#glow)">
    <text class="sans" x="60" y="140" font-size="76" font-weight="800" fill="url(#neon)" letter-spacing="4">HYPEREVAC</text>
    <text class="sans" x="62" y="200" font-size="40" font-weight="600" fill="#e6f7ff" letter-spacing="14">SYSTEM</text>
  </g>
  <text class="mono" x="62" y="245" font-size="18" fill="#00f0ff">&gt; Early Warning &amp; Hyper-Local Evacuation Navigation<tspan class="blink">_</tspan></text>
  <text class="mono" x="62" y="275" font-size="14" fill="#8aa0c8">software-only  |  real-time data aggregation  |  spiral model</text>

  <!-- scanline -->
  <rect class="scan" x="0" y="0" width="1200" height="3" fill="#00f0ff" fill-opacity="0.5"/>

  <!-- frame -->
  <rect x="4" y="4" width="1192" height="312" rx="14" fill="none" stroke="url(#neon)" stroke-width="2.5"/>
</svg>

