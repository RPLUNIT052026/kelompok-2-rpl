version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: hyperevac_postgis
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hyperevac_db}
      POSTGRES_USER: ${POSTGRES_USER:-hyperevac_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hyperevac_password_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Opsional: Otomatis mengeksekusi skema tabel PostGIS saat container pertama kali dibuat
      - ../Desain-dan-Arsitektur/CLASS-DAN-DATABASE.md:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hyperevac_user} -d ${POSTGRES_DB:-hyperevac_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
